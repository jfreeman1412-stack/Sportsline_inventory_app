# Apache site for the inventory app, served by the sytist container.
# Copy to /home/sytist_docker/apache-live/sites-enabled/zz-inventory.conf
# Uses the same Cloudflare origin certificate as the other zz-*.conf sites.
<VirtualHost *:80>
    ServerName inventory.sportslinephotography.com
    Redirect permanent / https://inventory.sportslinephotography.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName inventory.sportslinephotography.com

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/cloudflare.crt
    SSLCertificateKeyFile /etc/apache2/ssl/cloudflare.key

    ProxyPreserveHost On
    ProxyPass / http://inventory-app:8000/
    ProxyPassReverse / http://inventory-app:8000/

    ErrorLog ${APACHE_LOG_DIR}/inventory-error.log
    CustomLog ${APACHE_LOG_DIR}/inventory-access.log combined
</VirtualHost>
