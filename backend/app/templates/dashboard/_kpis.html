<div class="row">
  <div class="col-sm-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h6>Total Items</h6>
        <p class="display-6">{{ total_items }}</p>
      </div>
    </div>
  </div>
  <div class="col-sm-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h6>Low Stock</h6>
        <p class="display-6">{{ low_stock_items }}</p>
      </div>
    </div>
  </div>
  <div class="col-sm-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h6>Today's Deductions</h6>
        <p class="display-6">{{ today_deductions }}</p>
      </div>
    </div>
  </div>
</div>
{% if top_movers %}
  <div class="row mt-2">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="mb-3">Top Movers (last 7 days)</h6>
          <ul class="list-group list-group-flush">
            {% for mover in top_movers %}
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <strong>{{ mover.name }}</strong><br />
                  <small class="text-muted">{{ mover.sku }}</small>
                </div>
                <span class="badge bg-primary rounded-pill">{{ mover.qty | round(2) }}</span>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>
{% endif %}
