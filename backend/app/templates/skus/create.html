{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title">Create Raw Material</h2>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">SKU Code</label>
            <input type="text" name="sku_code" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Vendor</label>
            <input type="text" name="vendor_name" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Vendor URL</label>
            <input type="text" name="vendor_url" class="form-control" placeholder="https://example.com" />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea name="description" rows="2" class="form-control"></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label">Unit</label>
            <select name="unit_of_measure" class="form-select">
              <option value="pieces">Pieces</option>
              <option value="inches">Inches</option>
              <option value="feet">Feet</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Current Stock</label>
            <input type="number" step="0.01" name="current_stock" class="form-control" value="0" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Waste %</label>
            <input type="number" step="0.01" name="waste_pct" class="form-control" value="0" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Alert Threshold</label>
            <input type="number" step="0.01" name="alert_threshold_qty" class="form-control" />
          </div>
        </div>
        <div class="mt-4">
          <button class="btn btn-primary">Save</button>
          <a href="/skus" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
