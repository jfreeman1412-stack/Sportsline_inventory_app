{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title">My Account</h2>
          <p>Email: {{ current_user.email }}</p>
          <p>Role: {{ current_user.role.value }}</p>
          <form method="post" action="/account/alerts">
            <div class="form-check form-switch mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="alerts"
                name="receives_alerts"
                {% if current_user.receives_stock_alerts %}checked{% endif %}
              />
              <label class="form-check-label" for="alerts">Receive low-stock alerts</label>
            </div>
            <button class="btn btn-primary">Save preferences</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
