{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-3">Register</h2>
          {% if closed %}
            <p class="mb-3">Sign-up is closed. Ask the shop Owner to add you from Settings.</p>
            <a href="/login" class="btn btn-primary">Go to login</a>
          {% else %}
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <p class="text-muted small">The first account becomes the Owner.</p>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required minlength="8" />
            </div>
            <button class="btn btn-primary">Register</button>
            <a href="/login" class="btn btn-link">Already have an account?</a>
          </form>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
