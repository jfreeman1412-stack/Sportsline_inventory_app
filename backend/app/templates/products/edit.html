{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title">Edit Product</h2>
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Product Code</label>
            <input type="text" name="product_code" value="{{ product.product_code }}" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" name="name" value="{{ product.name }}" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" class="form-control" />
          </div>
          <div class="col-md-6 d-flex align-items-center gap-2">
            <input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %} />
            <label class="form-label mb-0">Active</label>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea name="description" rows="3" class="form-control">{{ product.description }}</textarea>
          </div>
        </div>
        <div class="mt-4">
          <button class="btn btn-primary">Save</button>
          <a href="/products/{{ product.product_id }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
