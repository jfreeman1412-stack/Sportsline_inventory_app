{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h2 class="mb-1">Inventory Dashboard</h2>
      <p class="text-muted small mb-0">
        Track stock, upcoming production usage, and proactive reorder alerts.
      </p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/">Back to Home</a>
      {% if app_debug %}
        <button id="run-forecast-button" class="btn btn-sm btn-success">
          Run Forecast Now
        </button>
      {% endif %}
    </div>
  </div>
  <div class="row">
    <div class="col-lg-3 mb-3">
      <div hx-get="/dashboard/filters" hx-target="#dashboard-filters" hx-trigger="load">
        <div id="dashboard-filters"></div>
      </div>
      <div hx-get="/dashboard/alerts" hx-target="#dashboard-alerts" hx-trigger="load every 5m">
        <div id="dashboard-alerts" class="mt-3"></div>
      </div>
    </div>
    <div class="col-lg-9">
      <div hx-get="/dashboard/kpis" hx-target="#dashboard-kpis" hx-trigger="load">
        <div id="dashboard-kpis"></div>
      </div>
      <div id="dashboard-trend-card" class="card shadow-sm mt-3" style="position: relative; min-height: 320px;">
        <div class="card-body">
          <canvas id="trendChart"></canvas>
          <div
            id="trend-placeholder"
            class="alert alert-warning position-absolute top-50 start-50 translate-middle w-75 text-center d-none"
          >
            No historical data yet – run the forecast job to seed predictions.
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const chartCtx = document.getElementById("trendChart")?.getContext("2d");
    const trendPlaceholder = document.getElementById("trend-placeholder");
    const runForecastButton = document.getElementById("run-forecast-button");
    let trendChart = null;

    function buildQueryParams() {
      const form = document.getElementById("dashboard-filter-form");
      if (!form) {
        return "";
      }
      const data = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of data.entries()) {
        if (value) {
          params.append(key, value);
        }
      }
      return params.toString();
    }

    async function refreshTrendData() {
      if (!chartCtx) {
        return;
      }
      const params = buildQueryParams();
      const response = await fetch(`/dashboard/trend-data?${params}`);
      if (!response.ok) {
        return;
      }
      const payload = await response.json();
      updateChart(payload);
    }

    async function refreshAlerts() {
      const params = buildQueryParams();
      const response = await fetch(`/dashboard/alerts?${params}`);
      if (!response.ok) {
        return;
      }
      const html = await response.text();
      const target = document.getElementById("dashboard-alerts");
      if (target) {
        target.innerHTML = html;
      }
    }

    function createTooltipLabel(context) {
      const label = context.dataset.label || "";
      const value = context.parsed.y ?? 0;
      return `${label}: ${value.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
    }

    function toggleChartPlaceholder(show) {
      if (!trendPlaceholder) {
        return;
      }
      trendPlaceholder.classList.toggle("d-none", !show);
    }

    function updateChart(data) {
      if (!chartCtx) {
        return;
      }
      const hasHistory =
        data.datasets &&
        data.datasets.some((dataset) =>
          dataset.data.some((value) => Number(value) > 0)
        );
      toggleChartPlaceholder(!hasHistory);
      const forecastLabels = data.forecast_labels || [];
      const forecastDatasets = (data.forecast_datasets || []).map((dataset) => ({
        ...dataset,
        data: Array(data.labels.length).fill(null).concat(dataset.data || []),
        borderDash: dataset.borderDash || [6, 6],
        pointRadius: 0,
      }));
      const combinedLabels = data.labels.concat(forecastLabels);
      const combinedDatasets = [...data.datasets, ...forecastDatasets];
      if (!trendChart) {
        trendChart = new Chart(chartCtx, {
          type: "line",
          data: {
            labels: combinedLabels,
            datasets: combinedDatasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            plugins: {
              legend: {
                display: true,
                position: "bottom",
                labels: {
                  padding: 12,
                },
              },
              tooltip: {
                callbacks: {
                  label: createTooltipLabel,
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  callback: (value) => value.toLocaleString(),
                },
              },
            },
          },
        });
      } else {
        trendChart.data.labels = combinedLabels;
        trendChart.data.datasets = combinedDatasets;
        trendChart.update();
      }
    }

    async function runForecastNow() {
      if (!runForecastButton) {
        return;
      }
      runForecastButton.disabled = true;
      runForecastButton.textContent = "Running...";
      try {
        const response = await fetch("/dashboard/admin/run-forecast-now", {
          method: "POST",
        });
        if (!response.ok) {
          throw new Error("Forecast failed");
        }
        await Promise.all([refreshTrendData(), refreshKPIs(), refreshAlerts()]);
      } catch (error) {
        console.error("Forecast error", error);
      } finally {
        runForecastButton.disabled = false;
        runForecastButton.textContent = "Run Forecast Now";
      }
    }

    async function refreshKPIs() {
      const params = buildQueryParams();
      const response = await fetch(`/dashboard/kpis?${params}`);
      if (!response.ok) {
        return;
      }
      const html = await response.text();
      const target = document.getElementById("dashboard-kpis");
      if (target) {
        target.innerHTML = html;
      }
    }

    function attachFilterListeners() {
      const form = document.getElementById("dashboard-filter-form");
      if (!form) {
        return;
      }
      form.addEventListener("change", () => {
        refreshTrendData();
        refreshAlerts();
      });
    }

    document.addEventListener("htmx:afterSwap", (event) => {
      if (event.detail.target.id === "dashboard-filters") {
        attachFilterListeners();
        refreshTrendData();
        refreshAlerts();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      attachFilterListeners();
      refreshTrendData();
      refreshAlerts();
      if (runForecastButton) {
        runForecastButton.addEventListener("click", runForecastNow);
      }
    });
  </script>
{% endblock %}
