version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    volumes:
      - static-data:/app/static
  poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/poller/poller.py"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      - app

volumes:
  static-data:
